<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Actuele voorraad</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="voorraadpagina">
        <header class="pagina-header">
            <p class="locatie">Camping en appartementen</p>
            <h1>Vandaag beschikbaar</h1>
            <p>Vraag bij de receptie naar deze producten.</p>
        </header>

        <section class="producten" aria-label="Actuele voorraad">
            <article class="product">
                <div>
                    <h2>Verse melk</h2>
                    <p class="status">Beschikbaar</p>
                </div>

                <p class="aantal">
                    <strong>6</strong>
                    <span>op voorraad</span>
                </p>
            </article>

            <article class="product">
                <div>
                    <h2>Verse yoghurt</h2>
                    <p class="status">Beschikbaar</p>
                </div>

                <p class="aantal">
                    <strong>3</strong>
                    <span>op voorraad</span>
                </p>
            </article>

            <article class="product uitverkocht">
                <div>
                    <h2>IJsjes</h2>
                    <p class="status">Uitverkocht</p>
                </div>

                <p class="aantal">
                    <strong>0</strong>
                    <span>op voorraad</span>
                </p>
            </article>
        </section>
    </main>
</body>

</html>
