<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Medewerker inloggen</title>

    <link rel="stylesheet" href="inloggen.css">
</head>

<body>
    <main class="inlogpagina">
        <header>
            <p class="locatie">
                Camping en appartementen
            </p>

            <h1>Medewerker inloggen</h1>

            <p>
                Log in om de voorraad te beheren.
            </p>
        </header>


        <form id="inlogformulier">
            <div class="veld">
                <label for="gebruikersnaam">
                    Gebruikersnaam
                </label>

                <input id="gebruikersnaam" name="gebruikersnaam" type="text" autocomplete="username" maxlength="100"
                    required autofocus>
            </div>

            <div class="veld">
                <label for="wachtwoord">
                    Wachtwoord
                </label>

                <input id="wachtwoord" name="wachtwoord" type="password" autocomplete="current-password" maxlength="200"
                    required>
            </div>

            <button id="inlogknop" type="submit">
                Inloggen
            </button>
        </form>

        <p id="inlogmelding" class="melding" role="status" aria-live="polite"></p>

        <a class="teruglink" href="/">
            Terug naar de publieke voorraad
        </a>
    </main>

    <script src="inloggen.js"></script>
</body>

</html>
