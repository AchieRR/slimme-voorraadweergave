<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Voorraadbeheer</title>

    <link rel="stylesheet" href="beheer.css">
</head>

<body>
    <main class="beheerpagina">
        <header>
            <p class="locatie">Camping en appartementen</p>
            <h1>Voorraadbeheer</h1>
            <p>Pas hier de actuele voorraad aan.</p>
        </header>

        <div class="sessiebalk">
            <p>
                Ingelogd als <strong id="medewerkernaam">...</strong>
            </p>

            <button id="uitlogknop" type="button">
                Uitloggen
            </button>
        </div>

        <p id="melding" class="melding" role="status" aria-live="polite">
        </p>

        <details class="historie">
            <summary>
                Wijzigingshistorie bekijken
            </summary>

            <p>
                Hier staan de honderd nieuwste productwijzigingen.
            </p>

            <div id="wijzigingen" class="wijzigingen" aria-live="polite">
                Historie wordt geladen...
            </div>
        </details>


        <section class="nieuw-product">
            <h2>Nieuw product</h2>

            <form id="nieuw-product-formulier">
                <div class="veld">
                    <label for="productnaam">Productnaam</label>
                    <input id="productnaam" type="text" minlength="2" maxlength="100" required>
                </div>

                <div class="veld">
                    <label for="beginvoorraad">Beginvoorraad</label>
                    <input id="beginvoorraad" type="number" min="0" max="10000" step="1" value="0" required>
                </div>

                <div class="veld">
                    <label for="productprijs">Prijs in euro</label>
                    <input id="productprijs" type="number" min="0.01" max="10000" step="0.01" placeholder="1.80"
                        required>
                </div>

                <div class="veld">
                    <label for="producteenheid">Prijs per</label>
                    <input id="producteenheid" type="text" minlength="1" maxlength="30" value="stuk" required>
                </div>

                <button class="toevoegknop" type="submit">
                    Toevoegen
                </button>
            </form>
        </section>



        <section id="beheer-producten" class="producten" aria-label="Producten beheren">
        </section>
    </main>

    <script src="beheer.js"></script>
</body>

</html>
